name: EnterpriseHub CI

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"

  pull_request:
    branches:
      - main
      - develop

jobs:
  backend:
    name: Backend - Build & Docker
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Make Maven Wrapper executable
        working-directory: Backend
        run: chmod +x mvnw

      - name: Build backend
        working-directory: Backend
        run: ./mvnw clean package -DskipTests

      - name: Build backend Docker image
        run: docker build -t enterprisehub-backend ./Backend


  frontend:
    name: Frontend - Build & Docker
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build frontend Docker image
        run: docker build -t enterprisehub-frontend ./Frontend