spring.application.name=backend

# Database
spring.datasource.url=jdbc:postgresql://postgres:5432/enterprisehub
spring.datasource.username=enterprisehub
spring.datasource.password=enterprisehub123

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# JWT
app.jwt.secret=change-this-secret-key-to-a-long-random-secret-key
app.jwt.expiration=3600000

# Server
server.port=8080