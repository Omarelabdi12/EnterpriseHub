<header class="topbar-container">

  <div class="topbar-left">
    <div class="page-context">
      <span class="page-label">WORKSPACE</span>
      <h1>Dashboard</h1>
    </div>
  </div>

  <div class="topbar-right">

    <button class="icon-button" aria-label="Search">
      <lucide-icon [img]="Search" />
    </button>

    <button class="icon-button notification-button" aria-label="Notifications">
      <lucide-icon [img]="Bell" />
      <span class="notification-dot"></span>
    </button>

    <div class="topbar-divider"></div>

    <button class="user-menu">
      <div class="user-avatar">O</div>

      <div class="user-info">
        <span>Omar</span>
        <small>Administrator</small>
      </div>

      <lucide-icon [img]="ChevronDown" />
    </button>

  </div>

</header>
